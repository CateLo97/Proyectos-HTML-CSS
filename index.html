<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page in HTML, CSS & JS </title>

    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!--Google Fonts end-->
    <!--styles-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!--styles end-->
</head>
<body class="dark">
    <!--Header start-->
    <header>
        <div class="container">
            <div class="navbar">
                <div class="logo">
                    <img src="img/stars.png" alt="logo">
                    <h2>Stars</h2>
                </div>
                <nav>
                    <ul>
                        <li><a href="#">Home</a></li>
                        <li><a href="#">Preferences</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Contact</a></li>

                    </ul>      
                </nav>
                <div class="dark_mode">
                    <div class="social_icons below_content">
                        <i id="theme-toggle" class="bi bi-moon-fill"></i>
                    </div>
                </div>     
            </div>
        </div>
    </header>
    <!--Header close-->

    <!--Showcase-->
    <main>
        <div class="container">
           <div class="showcase">
            <div class="left_side_content">
                <h2>Business Woman</h2>
                <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ducimus, dicta! Voluptate fugiat minus natus, eum possimus tempore veritatis quisquam ullam laboriosam.</p>
                <button type="button">Learn More</button>
            </div>
            <div class="right_side_content">
                <img src="img/business-woman.jpg" alt="Business Woman">
            </div>
           </div>
            <!--Showcase close-->

            <!--down side-->
            <div class="below_content">
                <div class="social_icons">
                    <i class="bi bi-facebook"></i>
                    <i class="bi bi-twitter-x"></i>
                    <i class="bi-pinterest"></i>
                </div>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
